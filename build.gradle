plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.inspien.eai.EaiApplication'
}

tasks.named('run') {
    workingDir = rootDir
}

group = 'com.inspien.eai'
version = '0.1.0'

// 로컬 JDK(25)로 빌드하되 산출물은 Java 17 기준
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'commons-net:commons-net:3.11.1'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.5.0.24.07'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// 과제 제공 정보 수신 + 접속정보 복호화 (1회성 준비 도구)
tasks.register('fetchInfo', JavaExec) {
    group = 'setup'
    description = '제공 정보 API 호출 → secrets/ 에 응답 저장 → 접속정보 복호화 확인'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.inspien.eai.tool.FetchProvisionInfo'
    workingDir = rootDir
    // 사용: gradle fetchInfo [-Prefetch] [-Preveal]
    args = ['refetch', 'reveal'].findAll { project.hasProperty(it) }.collect { '--' + it }
    standardInput = System.in
}

// 접속 점검 (읽기 전용): DB 컬럼·PK 대조, FTP 경로·UTF-8 확인
tasks.register('connCheck', JavaExec) {
    group = 'setup'
    description = 'DB·FTP 접속 점검 (읽기 전용, 주소·계정 비노출)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.inspien.eai.tool.ConnectivityCheck'
    workingDir = rootDir
}
